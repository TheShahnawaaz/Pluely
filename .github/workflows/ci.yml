name: Build and test Pluely
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo test -p pluely-core
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: test-results
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            config: src-tauri/tauri.macos.conf.json
          - os: macos-15-intel
            target: x86_64-apple-darwin
            config: src-tauri/tauri.macos.conf.json
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            config: src-tauri/tauri.conf.json
    runs-on: ${{ matrix.os }}
    env:
      WHISPER_DONT_GENERATE_BINDINGS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      MACOSX_DEPLOYMENT_TARGET: '14.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - run: cargo test -p pluely-core
      - run: node scripts/build-sidecars.mjs ${{ matrix.target }}
      - run: npm run tauri -- build --target ${{ matrix.target }} --config ${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        with:
          name: Pluely-${{ matrix.target }}-unsigned
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
